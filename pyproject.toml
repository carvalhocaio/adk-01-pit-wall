[project]
name = "adk-01-pit-wall"
version = "0.1.0"
description = "Starter template for modern Python projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiolimiter>=1.3.0",
    "google-adk>=2.10.0,<3",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adk_01_pit_wall"]

[dependency-groups]
dev = [
    "pip-audit>=2.10.0",
    "pre-commit>=4.0.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.4.0",
    "ruff==0.16.9",
]
eval = [
    "google-adk[eval]>=2.10.0,<3",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "C4",   # flake8-comprehensions
    "RET",  # flake8-return
    "TID",  # flake8-tidy-imports
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = [
    "ignore:\\[EXPERIMENTAL\\] feature .*:UserWarning",
]
